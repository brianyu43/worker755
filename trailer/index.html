<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1322" />
    <title>Worker 755: trailer</title>
    <meta name="description" content="Agents call subagents. What if one of them was you?" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c2a4a'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='13' font-weight='700' text-anchor='middle' fill='%23dfe4dc'%3E755%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="game.css" />
    <link rel="stylesheet" href="trailer.css" />
    <script src="vendor/open-bot-avatar.js" defer></script>
    <script src="score.js" defer></script>
    <script src="trailer.js" defer></script>
  </head>
  <body>
    <div class="viewport">
      <main class="stage" id="stage" aria-live="off"></main>
    </div>

    <button type="button" class="start-gate" id="gate">
      <span class="gate-play" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" /></svg>
      </span>
      <span class="gate-label" id="gate-label">Play with sound</span>
    </button>

    <div class="controls" id="controls">
      <button type="button" class="btn btn-ink" id="replay">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Replay
      </button>
      <button type="button" class="btn btn-ink" id="mute">Sound on</button>
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
    </div>
  </body>
</html>
